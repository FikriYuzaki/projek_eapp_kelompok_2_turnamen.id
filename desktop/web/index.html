<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turnamen.in — Esports Tournament Management System</title>
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" aria-label="Navigasi Utama">
      <div class="sidebar-brand">
        <img src="assets/images/logo.svg" alt="Logo Turnamen.in" />
        <div>
          <span class="sidebar-brand-title">Turnamen.in</span>
          <span class="sidebar-brand-subtitle">Esports Management Suite</span>
        </div>
      </div>
      <nav class="sidebar-nav">
  <div class="nav-section-label">Utama</div>

  <button class="nav-item active" data-page="dashboard">
    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="3" width="8" height="8" rx="1.5"/>
      <rect x="13" y="3" width="8" height="5" rx="1.5"/>
      <rect x="13" y="10" width="8" height="11" rx="1.5"/>
      <rect x="3" y="13" width="8" height="8" rx="1.5"/>
    </svg>
    <span>Dashboard</span>
  </button>

  <button class="nav-item" data-page="tournament-list">
    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M8 4h8v5a4 4 0 0 1-8 0V4Z"/>
      <path d="M8 6H5v2a4 4 0 0 0 4 4M16 6h3v2a4 4 0 0 1-4 4"/>
      <path d="M12 13v5M8 21h8M10 18h4"/>
    </svg>
    <span>Daftar Turnamen</span>
  </button>

  <button class="nav-item" data-page="tournament-detail">
    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/>
      <path d="M14 2v6h6M8 13h8M8 17h8M8 9h2"/>
    </svg>
    <span>Detail &amp; Peserta</span>
  </button>

  <div class="nav-section-label">Kompetisi &amp; Pertandingan</div>

  <button class="nav-item" data-page="team-management">
    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/>
      <path d="m9 12 2 2 4-4"/>
    </svg>
    <span>Manajemen Tim</span>
  </button>

  <button class="nav-item" data-page="match-management">
    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="m14 6 4-4 4 4-4 4"/>
      <path d="m10 18-4 4-4-4 4-4"/>
      <path d="m20 2-9 9M4 22l9-9"/>
      <path d="m14 14 6 6M4 4l6 6"/>
    </svg>
    <span>Jadwal &amp; Skor Match</span>
  </button>

  <button class="nav-item" data-page="bracket">
    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 4v6h6M4 10l6-6M20 20v-6h-6M20 14l-6 6"/>
      <path d="M10 7h4a3 3 0 0 1 3 3v4M14 17h-4a3 3 0 0 1-3-3v-4"/>
    </svg>
    <span>Bracket 8 Tim</span>
  </button>

  <div class="nav-section-label">Komunikasi &amp; Laporan</div>

  <button class="nav-item" data-page="announcements">
    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 11v2a2 2 0 0 0 2 2h2l10 5V4L7 9H5a2 2 0 0 0-2 2Z"/>
      <path d="M7 15l2 6h4l-2-4M19 9a4 4 0 0 1 0 6"/>
    </svg>
    <span>Pengumuman</span>
  </button>

  <button class="nav-item" data-page="reports">
    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 3v18h18"/>
      <path d="m7 14 4-4 4 3 6-7"/>
      <path d="M17 6h4v4"/>
    </svg>
    <span>Laporan &amp; Klasemen</span>
  </button>

  <div class="nav-section-label">Akun &amp; Akses</div>

  <button class="nav-item" data-page="profile">
    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21a8 8 0 0 1 16 0"/>
    </svg>
    <span>Profil Pengguna</span>
  </button>

  <button class="nav-item" data-page="login">
    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M10 17l5-5-5-5M15 12H3"/>
      <path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/>
    </svg>
    <span>Login / Ganti Role</span>
  </button>
</nav>


      <div class="sidebar-footer" id="sidebar-api-status">
        <span>● Memeriksa koneksi API...</span>
      </div>
    </aside>

    <!-- Main Desktop Workspace -->
    <div class="main-workspace">
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="topbar-title" id="topbar-page-title">Dashboard Utama</h1>
          <span class="badge badge-warning" id="app-mode-badge">MOCK MODE (SIMULASI LOKAL)</span>
        </div>

        <div class="topbar-right">
          <label for="topbar-role-switcher" style="font-size:12px; color:var(--text-secondary);">Simulasi Role:</label>
          <select id="topbar-role-switcher" class="form-select" style="padding:5px 9px; font-size:12px;">
            <option value="super_admin">Super Admin</option>
            <option value="organizer" selected>Tournament Organizer</option>
            <option value="committee">Committee / Panitia</option>
            <option value="team_captain">Team Captain</option>
            <option value="player">Player</option>
          </select>
          <span class="badge badge-info tabular-nums" id="topbar-active-user">garuda_eo (organizer)</span>
        </div>
      </header>

      <main class="content-area" id="main-content" role="main">
        <!-- Dynamic page content rendered by desktop/web/assets/js/pages/app-pages.js -->
      </main>
    </div>
  </div>

  <!-- Reusable Application Modal -->
  <div id="app-modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-dialog">
      <div class="card-header">
        <h3 class="card-title" id="app-modal-title">Dialog</h3>
        <button class="btn btn-secondary btn-sm" onclick="TurnamenUI.closeModal()">✕</button>
      </div>
      <div id="app-modal-body"></div>
      <div id="app-modal-footer" style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;"></div>
    </div>
  </div>

  <!-- Optional Python Eel script (loaded automatically when served by Eel, ignored safely in standalone browser) -->
  <script type="text/javascript" src="/eel.js"></script>
  <script src="assets/js/core/config.js"></script>
  <script src="assets/js/core/eel-bridge.js"></script>
  <script src="assets/js/core/api-client.js"></script>
  <script src="assets/js/components/ui-components.js"></script>
  <script src="assets/js/pages/app-pages.js"></script>
</body>
</html>
