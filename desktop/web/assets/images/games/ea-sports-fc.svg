<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" fill="none">
  <defs>
    <linearGradient id="fc-sky" x1="480" y1="0" x2="480" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050912"/>
      <stop offset="65%" stop-color="#0C152C"/>
      <stop offset="100%" stop-color="#111E3D"/>
    </linearGradient>
    <linearGradient id="fc-turf" x1="480" y1="240" x2="480" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#082424"/>
      <stop offset="50%" stop-color="#0D3A34"/>
      <stop offset="100%" stop-color="#082825"/>
    </linearGradient>
    <radialGradient id="fc-center-light" cx="50%" cy="62%" r="48%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.22"/>
      <stop offset="52%" stop-color="#00E5FF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#060A14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fc-scrim" x1="480" y1="305" x2="480" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060A14" stop-opacity="0"/>
      <stop offset="58%" stop-color="#060A14" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#060A14" stop-opacity="0.93"/>
    </linearGradient>
  </defs>

  <!-- Night Stadium Sky -->
  <rect width="960" height="540" fill="url(#fc-sky)"/>

  <!-- Tiered Stadium Bowl & Spectator Seating -->
  <path d="M0,255 Q480,145 960,255 L960,360 L0,360 Z" fill="#0B1328"/>
  <path d="M24,252 Q480,164 936,252" stroke="#1E3059" stroke-width="10"/>
  <path d="M40,268 Q480,185 920,268" stroke="#17264A" stroke-width="8"/>
  <path d="M60,284 Q480,206 900,284" stroke="#14203F" stroke-width="6"/>

  <!-- Futuristic Curved Roof Canopy & Structural Ribs -->
  <path d="M0,152 Q480,44 960,152 L960,110 Q480,4 0,110 Z" fill="#101B38" stroke="#253A6B" stroke-width="1.5"/>
  <path d="M0,148 Q480,48 960,148" stroke="#00E5FF" stroke-width="2.4" stroke-opacity="0.82"/>
  <path d="M0,122 Q480,24 960,122" stroke="#8B5CF6" stroke-width="1.6" stroke-opacity="0.65"/>

  <!-- Focused Stadium Floodlight Cones -->
  <polygon points="150,126 196,118 430,450 280,450" fill="#00E5FF" fill-opacity="0.055"/>
  <polygon points="340,94 388,88 530,450 400,450" fill="#E0F7FF" fill-opacity="0.05"/>
  <polygon points="572,88 620,94 560,450 430,450" fill="#E0F7FF" fill-opacity="0.05"/>
  <polygon points="764,118 810,126 680,450 530,450" fill="#8B5CF6" fill-opacity="0.06"/>

  <!-- Floodlight Fixtures on Canopy -->
  <g fill="#E0F7FF">
    <rect x="155" y="114" width="38" height="8" rx="3"/>
    <rect x="345" y="84" width="42" height="8" rx="3"/>
    <rect x="573" y="84" width="42" height="8" rx="3"/>
    <rect x="767" y="114" width="38" height="8" rx="3"/>
  </g>

  <!-- Perimeter LED Advertising Boards (Abstract Cyan/Violet Bands, No Text) -->
  <path d="M48,292 L912,292 L930,308 L30,308 Z" fill="#091224" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.6"/>
  <line x1="120" y1="300" x2="290" y2="300" stroke="#00E5FF" stroke-width="3" stroke-opacity="0.7"/>
  <line x1="330" y1="300" x2="630" y2="300" stroke="#8B5CF6" stroke-width="3" stroke-opacity="0.65"/>
  <line x1="670" y1="300" x2="840" y2="300" stroke="#34D399" stroke-width="3" stroke-opacity="0.7"/>

  <!-- Perspective Night Turf Pitch -->
  <polygon points="48,308 912,308 960,540 0,540" fill="url(#fc-turf)"/>
  <polygon points="180,308 265,308 175,540 30,540" fill="#FFFFFF" fill-opacity="0.03"/>
  <polygon points="350,308 435,308 415,540 275,540" fill="#FFFFFF" fill-opacity="0.03"/>
  <polygon points="525,308 610,308 685,540 545,540" fill="#FFFFFF" fill-opacity="0.03"/>
  <polygon points="695,308 780,308 930,540 785,540" fill="#FFFFFF" fill-opacity="0.03"/>
  <ellipse cx="480" cy="405" rx="420" ry="135" fill="url(#fc-center-light)"/>

  <!-- Regulation Pitch Lines -->
  <g stroke="#CCFBF1" stroke-opacity="0.72" stroke-width="2">
    <polygon points="94,322 866,322 938,492 22,492" fill="none"/>
    <line x1="480" y1="322" x2="480" y2="492"/>
    <ellipse cx="480" cy="402" rx="92" ry="30"/>
    <circle cx="480" cy="402" r="4" fill="#00E5FF" stroke="none"/>
    <!-- Left & Right Penalty Boxes -->
    <polygon points="78,360 198,360 176,448 40,448" fill="none"/>
    <polygon points="882,360 762,360 784,448 920,448" fill="none"/>
  </g>

  <!-- Crisp Isometric Goal Frames -->
  <g stroke="#E2E8F0" stroke-width="2" stroke-opacity="0.88">
    <polyline points="54,376 54,336 74,322 74,360" fill="#00E5FF" fill-opacity="0.08"/>
    <polyline points="906,376 906,336 886,322 886,360" fill="#8B5CF6" fill-opacity="0.08"/>
  </g>

  <!-- Lower Third Contrast Scrim -->
  <rect x="0" y="305" width="960" height="235" fill="url(#fc-scrim)"/>
</svg>
