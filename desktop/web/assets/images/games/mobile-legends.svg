<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" fill="none">
  <defs>
    <linearGradient id="ml-sky" x1="480" y1="0" x2="480" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="48%" stop-color="#0B1328"/>
      <stop offset="100%" stop-color="#070C18"/>
    </linearGradient>
    <radialGradient id="ml-core-glow" cx="50%" cy="40%" r="42%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#070C18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ml-river" x1="120" y1="490" x2="840" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#063954" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#00E5FF" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="ml-crystal-left" x1="430" y1="100" x2="480" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="65%" stop-color="#00B8D9"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="ml-crystal-right" x1="530" y1="110" x2="480" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="60%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>
    <linearGradient id="ml-scrim" x1="480" y1="290" x2="480" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060A14" stop-opacity="0"/>
      <stop offset="58%" stop-color="#060A14" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#060A14" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <!-- Night Sky Backdrop -->
  <rect width="960" height="540" fill="url(#ml-sky)"/>
  <ellipse cx="480" cy="215" rx="370" ry="200" fill="url(#ml-core-glow)"/>

  <!-- Distant Citadel Ridges & Monoliths -->
  <polygon points="0,310 95,215 170,248 240,185 325,245 405,210 480,228 555,210 635,245 720,185 790,248 865,215 960,310 960,390 0,390" fill="#0B142B"/>
  <g fill="#121E3D" stroke="#1E325D" stroke-width="1.2">
    <polygon points="92,265 112,132 132,145 142,265"/>
    <polygon points="828,265 838,145 858,132 878,265"/>
    <rect x="206" y="142" width="18" height="106" rx="2"/>
    <rect x="736" y="142" width="18" height="106" rx="2"/>
  </g>
  <line x1="215" y1="154" x2="215" y2="232" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.55"/>
  <line x1="745" y1="154" x2="745" y2="232" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.65"/>

  <!-- Volumetric Arena Beams -->
  <polygon points="150,0 245,0 445,320 340,320" fill="#00E5FF" fill-opacity="0.045"/>
  <polygon points="715,0 810,0 620,320 515,320" fill="#8B5CF6" fill-opacity="0.05"/>

  <!-- Canyon Terrain & Stepped Cliff Banks -->
  <polygon points="0,335 280,290 420,332 340,425 0,468" fill="#0E1730"/>
  <polygon points="960,335 680,290 540,332 620,425 960,468" fill="#0F1936"/>
  <polygon points="0,382 255,342 365,378 290,462 0,540" fill="#132042"/>
  <polygon points="960,382 705,342 595,378 670,462 960,540" fill="#142246"/>

  <!-- Glowing Energy River Cutting Across Map -->
  <path d="M-20,515 C190,435 305,392 480,342 C655,292 785,268 980,238 L980,296 C785,326 665,358 495,412 C325,466 215,505 35,545 Z" fill="url(#ml-river)"/>
  <path d="M25,522 C205,446 318,402 486,352 C650,304 778,278 960,250" stroke="#67E8F9" stroke-width="2" stroke-opacity="0.7"/>
  <path d="M95,534 C250,468 355,428 510,382" stroke="#00E5FF" stroke-width="1.4" stroke-opacity="0.48"/>

  <!-- Midlane Causeway Bridge & Altar -->
  <polygon points="290,540 418,325 542,325 670,540" fill="#101B38" stroke="#263B6B" stroke-width="1.5"/>
  <polygon points="348,540 434,335 526,335 612,540" fill="#152347"/>
  <line x1="480" y1="342" x2="480" y2="540" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.45" stroke-dasharray="10 8"/>

  <!-- Central Sanctuary Platform -->
  <ellipse cx="480" cy="316" rx="146" ry="34" fill="#0B1329" stroke="#2D457A" stroke-width="2"/>
  <ellipse cx="480" cy="312" rx="112" ry="22" fill="#121F40" stroke="#00E5FF" stroke-width="1.6" stroke-opacity="0.7"/>
  <ellipse cx="480" cy="309" rx="76" ry="13" fill="none" stroke="#A78BFA" stroke-width="1.4" stroke-opacity="0.8"/>

  <!-- Heroic Crystal Nexus Spire -->
  <g>
    <polygon points="480,68 430,224 452,306 480,316" fill="url(#ml-crystal-left)"/>
    <polygon points="480,68 530,224 508,306 480,316" fill="url(#ml-crystal-right)"/>
    <polygon points="480,68 456,196 480,298 504,196" fill="#E0F7FF" fill-opacity="0.22"/>
    <polyline points="430,224 480,68 530,224" stroke="#A5F3FC" stroke-width="1.8" stroke-opacity="0.85"/>
    <line x1="480" y1="68" x2="480" y2="316" stroke="#E0F7FF" stroke-width="1.4" stroke-opacity="0.7"/>
  </g>

  <!-- Orbiting Rune Ring & Floating Shards -->
  <ellipse cx="480" cy="212" rx="92" ry="22" transform="rotate(-10 480 212)" stroke="#00E5FF" stroke-width="1.4" stroke-opacity="0.65" stroke-dasharray="14 7 4 7"/>
  <polygon points="374,174 385,150 396,174 385,194" fill="#00E5FF" fill-opacity="0.82"/>
  <polygon points="564,162 575,136 586,162 575,182" fill="#A78BFA" fill-opacity="0.85"/>
  <polygon points="416,118 424,102 432,118 424,132" fill="#67E8F9" fill-opacity="0.72"/>
  <polygon points="532,126 540,108 548,126 540,140" fill="#C4B5FD" fill-opacity="0.72"/>

  <!-- Flanking Turret Obelisks -->
  <g>
    <polygon points="242,326 254,234 274,234 286,326" fill="#132145" stroke="#2F4A85" stroke-width="1.5"/>
    <polygon points="264,198 250,226 264,244 278,226" fill="#00E5FF" fill-opacity="0.85"/>
    <polygon points="674,326 686,234 706,234 718,326" fill="#132145" stroke="#3B3F87" stroke-width="1.5"/>
    <polygon points="696,198 682,226 696,244 710,226" fill="#A78BFA" fill-opacity="0.85"/>
  </g>

  <!-- Lower Third Contrast Scrim -->
  <rect x="0" y="290" width="960" height="250" fill="url(#ml-scrim)"/>
</svg>
